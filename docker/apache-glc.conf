ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Redireccion a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://localhost:8443%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/glc.pem
    SSLCertificateKeyFile /etc/apache2/certs/glc-key.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Bloqueo estricto: nadie descarga directamente archivos de includes o assets/docs (los PDFs van por archivo.php)
    <DirectoryMatch "^/var/www/html/(includes|assets/docs)">
        Require all denied
    </DirectoryMatch>

    # Bloqueo de extensiones sensibles
    <FilesMatch "\.(db|sqlite|log|ps1|bak|yml|md|config|cer)$">
        Require all denied
    </FilesMatch>

    # Restringir metodos HTTP innecesarios
    <Location "/">
        <LimitExcept GET POST HEAD>
            Require all denied
        </LimitExcept>
    </Location>

    LimitRequestBody 2097152
</VirtualHost>
